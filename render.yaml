# Render blueprint: deploys the StarTrack API from this repo's server/ folder.
# Connect the GitHub repo on render.com and it reads this file.
services:
  - type: web
    name: startrack-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # paste your Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false # your Vercel URL, e.g. https://startrack.vercel.app
