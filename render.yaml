# Render blueprint: one service for the whole of StarTrack.
#
# The API process serves the built web client from dist/, so there is a single
# deployment on a single URL — no separate frontend host, and no CORS between
# them. Connect the GitHub repo on render.com and it reads this file.
services:
  - type: web
    name: startrack
    runtime: node
    plan: free
    # Dev dependencies are needed at build time (Vite, TypeScript) and pruned
    # afterwards, so the running container only carries what it needs.
    buildCommand: npm ci && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # paste your Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      # Optional — alerts appear in the app regardless; these add the email copy.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional — self-ping so Render's free tier doesn't sleep after 15m
      # idle. Render sets this automatically; left here only as documentation.
      # - key: RENDER_EXTERNAL_URL
